name: ecommerce
version: "1.0.0"
profile: ecommerce
model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

models:
  ecommerce:
    staging:      {+materialized: view,  +schema: staging}
    intermediate: {+schema: intermediate}
    marts:        {+materialized: table, +schema: marts}

vars:
  high_discount_threshold: 0.10
  min_valid_order_date: "2020-01-01"
  ambiguous_date_order: "mdy"      # decide with the created_at test (below)
  incremental_lag_hours: 1         # overlap window; dlt already re-reads 1h too